set -gF  @theme_status_user "#[default]#[fg=#{@theme_status_user_icon_bg}]#{@theme_status_left_separator}"
set -agF @theme_status_user "#[fg=#{@theme_status_user_icon_fg},bg=#{@theme_status_user_icon_bg}]#{@theme_user_icon}"
set -agF @theme_status_user "#{@theme_status_middle_separator}"
set -agF @theme_status_user "#[fg=#{@theme_status_user_text_fg},bg=#{@theme_status_user_text_bg}]"
set -ag  @theme_status_user "#{E:@theme_user_text}"
set -agF @theme_status_user "#[default]#[fg=#{@theme_status_user_text_bg}]#{@theme_status_right_separator}"

# --- module: weather -------------------------------------------------
set -g  @theme_weather_icon " "
set -gF @theme_weather_color "#{E:@sw_lavender}"
set -g  @theme_weather_text " #{l:#{weather}} "
set -gF @theme_status_weather_icon_fg "#{E:@sw_crust}"
set -gF @theme_status_weather_text_fg "#{E:@sw_fg}"
set -gF @theme_status_weather_icon_bg "#{@theme_weather_color}"
set -gF @theme_status_weather_text_bg "#{E:@theme_status_module_text_bg}"
set -gF  @theme_status_weather "#[default]#[fg=#{@theme_status_weather_icon_bg}]#{@theme_status_left_separator}"
set -agF @theme_status_weather "#[fg=#{@theme_status_weather_icon_fg},bg=#{@theme_status_weather_icon_bg}]#{@theme_weather_icon}"
set -agF @theme_status_weather "#{@theme_status_middle_separator}"
set -agF @theme_status_weather "#[fg=#{@theme_status_weather_text_fg},bg=#{@theme_status_weather_text_bg}]"
set -ag  @theme_status_weather "#{E:@theme_weather_text}"
set -agF @theme_status_weather "#[default]#[fg=#{@theme_status_weather_text_bg}]#{@theme_status_right_separator}"

# ──────────────────────────────────────────────────────────────────────
# Default status line
# ──────────────────────────────────────────────────────────────────────
set -g status-left "#{E:@theme_status_host}#{E:@theme_status_user}"
set -g status-right "#{E:@theme_status_directory}#{E:@theme_status_session}#{E:@theme_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100

# ──────────────────────────────────────────────────────────────────────
# Messages
# ──────────────────────────────────────────────────────────────────────
set -gF message-style         "fg=#{@sw_teal},bg=$SW_MESSAGE_BACKGROUND,align=centre"
set -gF message-command-style "fg=#{@sw_teal},bg=$SW_MESSAGE_BACKGROUND,align=centre"

# ──────────────────────────────────────────────────────────────────────
# Menu (tmux >= 3.4)
# ──────────────────────────────────────────────────────────────────────
%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "#{E:@theme_menu_selected_style}"
%endif

# ──────────────────────────────────────────────────────────────────────
# Panes
# ──────────────────────────────────────────────────────────────────────
set -wgF pane-active-border-style "#{E:@theme_pane_active_border_style}"
set -wgF pane-border-style        "#{E:@theme_pane_border_style}"

# ──────────────────────────────────────────────────────────────────────
# Pane status (border format)
# ──────────────────────────────────────────────────────────────────────
%if "#{==:#{@theme_pane_status_enabled},yes}"
  %if "#{==:#{@theme_pane_default_fill},none}"
    set -g @_sw_p_left   "#[fg=#{@sw_surface_0},bg=default]#{@theme_pane_left_separator}"
    set -g @_sw_p_middle "#[fg=#{@sw_fg},bg=#{@sw_surface_0}]#{@theme_pane_middle_separator}"
    set -g @_sw_p_right  "#[fg=#{@sw_surface_0},bg=default]#{@theme_pane_right_separator}"
    set -g @_sw_p_number "#[fg=#{@sw_fg},bg=#{@sw_surface_0}]##{pane_index}"
    set -g @_sw_p_text   "#[fg=#{@sw_fg},bg=#{@sw_surface_0}]#{E:@theme_pane_default_text}"
  %elif "#{==:#{@theme_pane_default_fill},all}"
    set -g @_sw_p_left   "#[fg=#{E:@theme_pane_color},bg=default]#{@theme_pane_left_separator}"
    set -g @_sw_p_middle "#[fg=#{E:@theme_pane_color},bg=#{E:@theme_pane_background_color}]#{@theme_pane_middle_separator}"
    set -g @_sw_p_right  "#[fg=#{E:@theme_pane_color},bg=default]#{@theme_pane_right_separator}"
    set -g @_sw_p_number "#[fg=#{E:@theme_pane_background_color},bg=#{E:@theme_pane_color}]##{pane_index}"
    set -g @_sw_p_text   "#[fg=#{E:@theme_pane_background_color},bg=#{E:@theme_pane_color}]#{E:@theme_pane_default_text}"
  %elif "#{==:#{@theme_pane_default_fill},number}"
    %if "#{==:#{@theme_pane_number_position},left}"
      set -g @_sw_p_left  "#[fg=#{E:@theme_pane_color},bg=default]#{@theme_pane_left_separator}"
      set -g @_sw_p_right "#[fg=#{E:@theme_pane_background_color},bg=default]#{@theme_pane_right_separator}"
    %else
      set -g @_sw_p_left  "#[fg=#{E:@theme_pane_background_color},bg=default]#{@theme_pane_left_separator}"
      set -g @_sw_p_right "#[fg=#{E:@theme_pane_color},bg=default]#{@theme_pane_right_separator}"
    %endif
    set -g @_sw_p_middle "#[fg=#{E:@theme_pane_color},bg=#{E:@theme_pane_background_color}]#{@theme_pane_middle_separator}"
    set -g @_sw_p_number "#[fg=#{E:@theme_pane_background_color},bg=#{E:@theme_pane_color}]##{pane_index}"
    set -g @_sw_p_text   "#[fg=#{E:@theme_pane_color},bg=#{E:@theme_pane_background_color}]#{E:@theme_pane_default_text}"
  %endif

  %if "#{==:#{@theme_pane_number_position},left}"
    set -wgF pane-border-format "#{E:@_sw_p_left}#{E:@_sw_p_number}#{E:@_sw_p_middle} #{E:@_sw_p_text}#{E:@_sw_p_right}"
  %else
    set -wgF pane-border-format "#{E:@_sw_p_left}#{E:@_sw_p_text} #{E:@_sw_p_middle}#{E:@_sw_p_number}#{E:@_sw_p_right}"
  %endif

  set -ug @_sw_p_left
  set -ug @_sw_p_middle
  set -ug @_sw_p_right
  set -ug @_sw_p_number
  set -ug @_sw_p_text
%endif

# ──────────────────────────────────────────────────────────────────────
# Popups (tmux >= 3.4)
# ──────────────────────────────────────────────────────────────────────
%if "#{>=:#{version},3.4}"
  set -gF popup-style        "bg=#{@sw_bg},fg=#{@sw_fg}"
  set -gF popup-border-style "fg=#{@sw_surface_1}"
%endif

# ──────────────────────────────────────────────────────────────────────
# Window status separators
# ──────────────────────────────────────────────────────────────────────
set -g @theme_window_left_separator   ""
set -g @theme_window_middle_separator ""
set -g @theme_window_right_separator  ""
set -g @theme_window_current_left_separator   ""
set -g @theme_window_current_middle_separator ""
set -g @theme_window_current_right_separator  ""

%if "#{==:#{@theme_window_status_style},rounded}"
  set -gF @theme_window_left_separator   "#[fg=#{@_sw_status_bg},reverse]#[none]"
  set -g  @theme_window_middle_separator " "
  set -gF @theme_window_right_separator  "#[fg=#{@_sw_status_bg},reverse]#[none]"
  
  set -gF @theme_window_current_left_separator   "#[fg=#{@_sw_status_bg},reverse]#[none]"
  set -g  @theme_window_current_middle_separator " "
  set -gF @theme_window_current_right_separator  "#[fg=#{@_sw_status_bg},reverse]#[none]"
%elif "#{==:#{@theme_window_status_style},slanted}"
  set -gF @theme_window_left_separator   "#[fg=#{@_sw_status_bg},reverse]#[none]"
  set -gF @theme_window_current_left_separator   "#[fg=#{@_sw_status_bg},reverse]#[none]"
  
  %if "#{==:#{@theme_window_number_position},left}"
    set -gF @theme_window_middle_separator "#[fg=#{@theme_window_number_color},bg=#{@theme_window_text_color}]"
    set -gF @theme_window_current_middle_separator "#[fg=#{@theme_window_current_number_color},bg=#{@theme_window_current_text_color}]"
  %else
    set -gF @theme_window_middle_separator "#[fg=#{@theme_window_number_color},bg=#{@theme_window_text_color}]"
    set -gF @theme_window_current_middle_separator "#[fg=#{@theme_window_current_number_color},bg=#{@theme_window_current_text_color}]"
  %endif
  
  set -gF @theme_window_right_separator "#[fg=#{@_sw_status_bg},reverse]#[none]"
  set -gF @theme_window_current_right_separator "#[fg=#{@_sw_status_bg},reverse]#[none]"
%endif

# ──────────────────────────────────────────────────────────────────────
# Window status format
# ──────────────────────────────────────────────────────────────────────
%if "#{!=:#{@theme_window_status_style},none}"
  set -gF window-status-activity-style "bg=#{@sw_lavender},fg=#{@sw_crust}"
  set -gF window-status-bell-style     "bg=#{@sw_yellow},fg=#{@sw_crust}"

  %if "#{==:#{@theme_window_flags},icon}"
    set -gF @_sw_w_flags "#{E:@theme_window_flags_icon_format}"
  %elif "#{==:#{@theme_window_flags},text}"
    set -g  @_sw_w_flags "#F"
  %else
    set -g  @_sw_w_flags ""
  %endif

  set -gF @_sw_w_number_style "#[fg=#{@sw_crust},bg=#{E:@theme_window_number_color}]"
  set -gF @_sw_w_text_style   "#[fg=#{@sw_fg},bg=#{E:@theme_window_text_color}]"

  set -gF window-status-format "#{E:@theme_window_left_separator}#{E:@_sw_w_number_style}#{@theme_window_number}#{E:@theme_window_middle_separator}#{E:@_sw_w_text_style}#{@theme_window_text}#{@_sw_w_flags}#{E:@theme_window_right_separator}"

  set -gF @_sw_w_current_number_style "#[fg=#{@sw_crust},bg=#{E:@theme_window_current_number_color}]"
  set -gF @_sw_w_current_text_style   "#[fg=#{@sw_fg},bg=#{E:@theme_window_current_text_color}]"

  set -gF window-status-current-format "#{E:@theme_window_current_left_separator}#{E:@_sw_w_current_number_style}#{@theme_window_current_number}#{E:@theme_window_current_middle_separator}#{E:@_sw_w_current_text_style}#{@theme_window_current_text}#{@_sw_w_flags}#{E:@theme_window_current_right_separator}"

  set -ug @_sw_w_number_style
  set -ug @_sw_w_text_style
  set -ug @_sw_w_current_number_style
  set -ug @_sw_w_current_text_style
  set -ug @_sw_w_flags
%endif

# ──────────────────────────────────────────────────────────────────────
# Mode / clock
# ──────────────────────────────────────────────────────────────────────
set -gF mode-style        "bg=#{@sw_surface_0},bold"
set -gF clock-mode-colour "#{@sw_blue}"
set -g window-status-separator ""
